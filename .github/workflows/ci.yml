name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
  runtime:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install verified DSH
        shell: bash
        run: |
          DSH_VERSION="$(node --input-type=module -e "import { TESTED_DSH } from './src/plugin/versions.ts'; console.log(TESTED_DSH)")"
          npm install -g "@deepseek-ai/dsh@$DSH_VERSION"
      - shell: bash
        run: |
          export DSH_PACKAGE_ROOT="$(npm root -g)/@deepseek-ai/dsh"
          npm run test:integration
